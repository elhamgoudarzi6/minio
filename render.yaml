
services:
  - type: web
    name: minio-server
    runtime: image
    image:
      url: cgr.dev/chainguard/minio
    plan: free
    healthCheckPath: /minio/health/live
    autoDeploy: false
    dockerCommand: minio server --address 0.0.0.0:$PORT /tmp/minio-data
    envVars:
      - key: MINIO_ROOT_USER
        generateValue: true
      - key: MINIO_ROOT_PASSWORD
        generateValue: true
      - key: PORT
        value: "10000"
      - key: MINIO_BROWSER
        value: "off"
